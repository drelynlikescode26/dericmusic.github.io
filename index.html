    <!-- Time-gated drop logic -->
    <script>
    (function () {
        var RELEASE   = new Date(2026, 6, 17, 0, 0, 0).getTime(); // Jul 17 — Dank drop
        var FORCE_END = new Date(2026, 6, 20, 0, 0, 0).getTime(); // Jul 20 — end of always-show
        var EXPIRE    = new Date(2026, 6, 25, 0, 0, 0).getTime(); // Jul 25 — fully expires
        var POPUP_KEY = 'deric_drop_popup_dank';
        var POPUP_TTL = 24 * 60 * 60 * 1000; // 24 h cooldown (days 4–7 only)
        var now = Date.now();

        function inWindow()      { return now >= RELEASE && now < EXPIRE; }
        function inForceWindow() { return now >= RELEASE && now < FORCE_END; }

        // Show banner pill for the full week
        var banner = document.getElementById('newDropBanner');
        if (banner && inWindow()) banner.style.display = '';

        if (!inWindow()) return;

        // First 3 days: show every single visit — skip the cooldown check
        if (!inForceWindow()) {
            var lastSeen = localStorage.getItem(POPUP_KEY);
            if (lastSeen && (now - parseInt(lastSeen, 10)) < POPUP_TTL) return;
        }

        function openPopup() {
            var overlay = document.getElementById('dropPopup');
            if (!overlay) return;
            overlay.hidden = false;
            document.body.classList.add('portal-open');
        }

        function closePopup() {
            var overlay = document.getElementById('dropPopup');
            if (!overlay) return;
            overlay.hidden = true;
            document.body.classList.remove('portal-open');
            // Only save timestamp during the 24h-cooldown window
            if (!inForceWindow()) {
                localStorage.setItem(POPUP_KEY, String(Date.now()));
            }
            // Resume hero video in case the overlay caused it to pause
            var video = document.querySelector('.hero-video');
            if (video && video.paused) video.play().catch(function () {});
        }

        document.addEventListener('DOMContentLoaded', function () {
            var closeBtn = document.getElementById('closeDropPopup');
            var overlay  = document.getElementById('dropPopup');
            if (closeBtn) closeBtn.addEventListener('click', closePopup);
            if (overlay) overlay.addEventListener('click', function (e) {
                if (e.target === overlay) closePopup();
            });
            setTimeout(openPopup, 900);
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closePopup();
        });
    })();
    </script>
