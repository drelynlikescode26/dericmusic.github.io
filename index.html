    <!-- Time-gated drop logic -->
    <script>
    (function () {
        // July 10 2026, midnight local time → July 17 2026 end of day
        var RELEASE = new Date(2026, 6, 10, 0, 0, 0).getTime();
        var EXPIRE  = new Date(2026, 6, 18, 0, 0, 0).getTime();
        var POPUP_KEY = 'deric_drop_popup';
        var POPUP_TTL = 24 * 60 * 60 * 1000; // show once per 24 h
        var now = Date.now();

        function inWindow() { return now >= RELEASE && now < EXPIRE; }

        // Show banner pill only during drop window
        var banner = document.getElementById('newDropBanner');
        if (banner && inWindow()) banner.style.display = '';

        // Popup
        if (!inWindow()) return;
        var lastSeen = localStorage.getItem(POPUP_KEY);
        if (lastSeen && (now - parseInt(lastSeen, 10)) < POPUP_TTL) return;

        function openPopup() {
            var overlay = document.getElementById('dropPopup');
            if (!overlay) return;
            overlay.hidden = false;
            document.body.classList.add('portal-open');
        }

        function closePopup() {
            var overlay = document.getElementById('dropPopup');
            if (!overlay) return;
            overlay.hidden = true;
            document.body.classList.remove('portal-open');
            localStorage.setItem(POPUP_KEY, String(Date.now()));
        }

        document.addEventListener('DOMContentLoaded', function () {
            var closeBtn = document.getElementById('closeDropPopup');
            var overlay  = document.getElementById('dropPopup');
            if (closeBtn) closeBtn.addEventListener('click', closePopup);
            if (overlay) overlay.addEventListener('click', function (e) {
                if (e.target === overlay) closePopup();
            });
            setTimeout(openPopup, 900);
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closePopup();
        });
    })();
    </script>
